        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Going Brand Colors */
            --cumulus: #FFFBED;      /* warm cream — page bg */
            --lagoon: #004449;       /* dark teal — primary, headings, buttons */
            --dune: #FFD3B6;         /* peach — soft accent surfaces */
            --sedona: #601124;       /* dark maroon — secondary accent */
            --riviera: #483CFF;      /* vibrant blue — links, focus, interactive */
            --calamansi: #D4FFBF;    /* light green — highlights, tags, success */

            /* Semantic tokens */
            --bg-page: var(--cumulus);
            --bg-card: #FFFFFF;
            --text-on-cumulus: var(--lagoon);
            --text-on-lagoon: #FFFFFF;
            --text-on-sedona: #FFFFFF;
            --text-on-riviera: #FFFFFF;
            --text-on-dune: var(--lagoon);
            --text-on-calamansi: var(--lagoon);
            --text-primary: var(--lagoon);
            --text-body: #1A2A2C;
            --text-muted: #5F7A7C;
            --input-border: #C8D6D7;
            --input-focus: var(--riviera);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-page);
            min-height: 100vh;
            padding: 24px;
            color: var(--text-body);
            font-size: 16px;
            line-height: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 68, 73, 0.06);
            padding: 36px;
        }

        h1 {
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 700;
            line-height: 32px;
        }

        .subtitle {
            color: var(--sedona);
            margin-bottom: 32px;
            font-size: 18px;
            font-weight: 700;
            line-height: 24px;
        }

        .form-section {
            margin-bottom: 28px;
        }

        label {
            display: block;
            color: var(--text-primary);
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 16px;
            line-height: 24px;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 24px;
            color: var(--text-body);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: var(--bg-card);
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            border-color: var(--input-focus);
            outline: none;
            box-shadow: 0 0 0 3px rgba(72, 60, 255, 0.15);
        }

        .card-search-container {
            position: relative;
        }

        #cardSearch {
            padding-right: 40px;
        }

        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 2px solid var(--riviera);
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 220px;
            overflow-y: auto;
            display: none;
            z-index: 100;
            box-shadow: 0 8px 20px rgba(0, 68, 73, 0.1);
        }

        .suggestion {
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid #f0f0f0;
        }

        .suggestion:last-child {
            border-bottom: none;
        }

        .suggestion:hover {
            background: var(--calamansi);
        }

        .suggestion-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }

        .suggestion-code {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: 10px;
            font-weight: 400;
        }

        .suggestion.highlighted {
            background: var(--calamansi);
            border-left: 4px solid var(--riviera);
            padding-left: 10px;
        }

        .selected-cards {
            margin-top: 12px;
            padding: 16px;
            background: var(--cumulus);
            border-radius: 8px;
            min-height: 60px;
        }

        .selected-card-chip {
            display: inline-flex;
            align-items: center;
            background: var(--lagoon);
            color: var(--text-on-lagoon);
            padding: 8px 14px;
            border-radius: 24px;
            margin: 4px;
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.25s ease;
            gap: 6px;
            cursor: grab;
        }

        .selected-card-chip:active {
            cursor: grabbing;
            opacity: 0.85;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .remove-card {
            margin-left: 4px;
            cursor: pointer;
            font-weight: bold;
            opacity: 0.8;
            transition: opacity 0.15s;
        }

        .remove-card:hover {
            opacity: 1;
        }

        .drag-hint {
            font-size: 12px;
            opacity: 0.7;
        }

        /* Email Type Radio Grid */
        .email-type-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .email-type-option {
            position: relative;
        }

        .email-type-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .email-type-option label {
            display: block;
            padding: 12px;
            background: var(--cumulus);
            border: 2px solid transparent;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 0;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-on-cumulus);
        }

        .email-type-option label:hover {
            border-color: var(--riviera);
            background: var(--bg-card);
        }

        .email-type-option input[type="radio"]:checked + label {
            background: var(--lagoon);
            color: var(--text-on-lagoon);
            border-color: var(--lagoon);
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Primary: Lagoon bg, white text */
        .btn-primary {
            background: var(--lagoon);
            color: var(--text-on-lagoon);
        }

        .btn-primary:hover {
            background: #00353A;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 68, 73, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Secondary: Dune bg, lagoon text */
        .btn-secondary {
            background: var(--dune);
            color: var(--text-on-dune);
        }

        .btn-secondary:hover {
            background: #FFC49E;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 211, 182, 0.5);
        }

        .btn-secondary:active {
            transform: translateY(0);
        }

        /* Result Section */
        .result-section {
            margin-top: 32px;
            padding: 24px;
            background: var(--calamansi);
            border-radius: 12px;
            display: none;
        }

        .result-label {
            font-weight: 700;
            color: var(--text-on-calamansi);
            margin-bottom: 10px;
            font-size: 16px;
        }

        .result-link {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 8px;
            word-break: break-all;
            font-family: 'Courier New', Courier, monospace;
            color: var(--riviera);
            margin-bottom: 16px;
            border: 2px solid var(--lagoon);
            font-size: 14px;
            line-height: 1.5;
        }

        .copy-btn {
            background: var(--lagoon);
            color: var(--text-on-lagoon);
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: #00353A;
            transform: translateY(-1px);
        }

        .copy-btn.copied {
            background: var(--riviera);
        }

        .help-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 16px;
        }

        .loader {
            display: none;
            width: 30px;
            height: 30px;
            border: 3px solid var(--dune);
            border-top: 3px solid var(--lagoon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

            <p class="help-text">Will be formatted as MMDDYY in the link</p>

        <div class="button-group">
            <button class="btn btn-primary" onclick="generateLink()">Generate Link</button>
            <button class="btn btn-secondary" onclick="clearAll()">Clear All</button>

            <div class="result-label">Generated Link:</div>
            <div class="result-link" id="resultLink"></div>
            <button class="copy-btn" onclick="copyLink()">📋 Copy Link</button>
        </div>

        <div class="loader" id="loader"></div>
    </div>

        let selectedCards = [];

        cardDatabase.forEach(card => {
            card.searchTerms = generateSearchTerms(card.name);
        });

        function generateSearchTerms(cardName) {
            const terms = [cardName.toLowerCase()];
            if (cardName.includes('Venture X Business')) {
                terms.push('venture x business', 'venturex business', 'capital one venture x business');
            } else if (cardName.includes('Venture X')) {
                terms.push('venture x', 'venturex', 'capital one venture x');
            }
            if (cardName.includes('Sapphire Preferred')) terms.push('csp', 'sapphire preferred', 'chase sapphire preferred');
            if (cardName.includes('Sapphire Reserve')) terms.push('csr', 'sapphire reserve', 'chase sapphire reserve');
            if (cardName.includes('Freedom')) terms.push('cfu', 'cff', 'chase freedom');
            if (cardName.includes('Platinum') && cardName.includes('American Express')) terms.push('amex platinum', 'platinum card');
            if (cardName.includes('Gold') && cardName.includes('American Express')) terms.push('amex gold', 'gold card');
            if (cardName.includes('Globe')) terms.push('globe', 'citi globe', 'aadvantage globe');
            const simplified = cardName.replace(/[®™()]/g, '').toLowerCase();
            terms.push(simplified);
            return terms;
        }

        function searchCards(query) {
            if (!query) return [];
            const searchQuery = query.toLowerCase();
            const matches = [];
            cardDatabase.forEach(card => {
                let score = 0;
                card.searchTerms.forEach(term => {
                    if (term.includes(searchQuery)) score = Math.max(score, 1);
                    if (term.startsWith(searchQuery)) score = Math.max(score, 2);
                    if (term === searchQuery) score = Math.max(score, 3);
                });
                if (card.name.toLowerCase().includes(searchQuery)) score = Math.max(score, 1);
                if (score > 0) matches.push({...card, score});
            });
            matches.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return a.name.localeCompare(b.name);
            });
            return matches.slice(0, 10);
        }

        function displaySuggestions(matches) {
            const suggestionsDiv = document.getElementById('suggestions');
            currentSuggestions = matches;
            highlightedIndex = -1;
            if (matches.length === 0) { suggestionsDiv.style.display = 'none'; return; }
            suggestionsDiv.innerHTML = '';
            matches.forEach((card, i) => {
                const div = document.createElement('div');
                div.className = 'suggestion';
                div.dataset.index = i;
                div.innerHTML = `<span class="suggestion-name">${card.name}</span><span class="suggestion-code">${card.code}</span>`;
                div.onclick = () => selectCard(card);
                suggestionsDiv.appendChild(div);
            });
            suggestionsDiv.style.display = 'block';
        }

        function updateHighlighted(items) {
            items.forEach(item => item.classList.remove('highlighted'));
            if (highlightedIndex >= 0 && highlightedIndex < items.length) {
                items[highlightedIndex].classList.add('highlighted');
            }
        }

        function selectCard(card) {
            if (selectedCards.find(c => c.code === card.code)) { alert('This card is already selected!'); return; }
            selectedCards.push(card);
            updateSelectedCardsDisplay();
            document.getElementById('cardSearch').value = '';
            document.getElementById('suggestions').style.display = 'none';
            highlightedIndex = -1;
            currentSuggestions = [];
        }

        function updateSelectedCardsDisplay() {
            const container = document.getElementById('selectedCards');
            if (selectedCards.length === 0) {
                container.innerHTML = '<span style="color: #5F7A7C;">No cards selected yet</span>';
                return;
            }
            container.innerHTML = selectedCards.map((card, index) => `
                <span class="selected-card-chip"
                      draggable="true"
                      ondragstart="handleDragStart(event, ${index})"
                      ondragover="handleDragOver(event, ${index})"
                      ondrop="handleDrop(event, ${index})">
                    ${index + 1}. ${card.name}
                    <span class="remove-card" onclick="removeCard(${index})">✕</span>
                </span>
            `).join('');
        }

        function removeCard(index) { selectedCards.splice(index, 1); updateSelectedCardsDisplay(); }
        function handleDragStart(event, index) { dragSrcIndex = index; event.dataTransfer.effectAllowed = 'move'; }
        function handleDragOver(event, index) { event.preventDefault(); event.dataTransfer.dropEffect = 'move'; }
        function handleDrop(event, index) {
            event.preventDefault();
            if (dragSrcIndex === null || dragSrcIndex === index) return;
            const draggedItem = selectedCards[dragSrcIndex];
            selectedCards.splice(dragSrcIndex, 1);
            selectedCards.splice(index, 0, draggedItem);
            dragSrcIndex = null;
            updateSelectedCardsDisplay();
        }

        function generateLink() {
            if (selectedCards.length === 0) { alert('Please select at least one card'); return; }
            const emailType = document.querySelector('input[name="emailType"]:checked').value;
            let emailPrefix = emailType;
            if (emailType === 'custom') {
                const customType = document.getElementById('customEmailType').value;
                if (!customType) { alert('Please enter a custom email type'); return; }
                emailPrefix = customType.trim().replace(/\s+/g, '');
            }
            const liveDate = document.getElementById('liveDate').value;
            if (!liveDate) { alert('Please select a live date'); return; }
            const [yearFull, month, day] = liveDate.split('-');
            const year = yearFull.slice(-2);
            const formattedDate = month + day + year;
            const shnqCodes = selectedCards.map(card => card.code).join(',');
            const link = `https://www.cardratings.com/bestcards/featured-credit-cards?src=691951&shnq=${shnqCodes}&var2={{var}}`;
            document.getElementById('resultLink').textContent = link;
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }

        function copyLink() {
            const link = document.getElementById('resultLink').textContent;
            navigator.clipboard.writeText(link).then(() => {
                const btn = event.target;
                btn.textContent = '✓ Copied!';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '📋 Copy Link'; btn.classList.remove('copied'); }, 2000);
            });
        }

        function clearAll() {
            selectedCards = [];
            updateSelectedCardsDisplay();
            document.getElementById('cardSearch').value = '';
            document.getElementById('liveDate').value = '';
            document.getElementById('customEmailType').value = '';
            document.getElementById('gwp').checked = true;
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('customEmailSection').style.display = 'none';
            highlightedIndex = -1;
            currentSuggestions = [];
            document.getElementById('suggestions').style.display = 'none';
        }

        const cardSearchInput = document.getElementById('cardSearch');

        cardSearchInput.addEventListener('input', (e) => {
            const query = e.target.value;
            if (query.length > 1) {
                displaySuggestions(searchCards(query));
            } else {
                document.getElementById('suggestions').style.display = 'none';
                currentSuggestions = [];
                highlightedIndex = -1;
            }
        });

        cardSearchInput.addEventListener('keydown', (e) => {
            const suggestionsDiv = document.getElementById('suggestions');
            const items = suggestionsDiv.querySelectorAll('.suggestion');
            if (suggestionsDiv.style.display === 'none' || items.length === 0) return;
            if (e.key === 'ArrowDown') { e.preventDefault(); highlightedIndex = (highlightedIndex + 1) % items.length; updateHighlighted(items); }
            if (e.key === 'ArrowUp') { e.preventDefault(); highlightedIndex = (highlightedIndex - 1 + items.length) % items.length; updateHighlighted(items); }
            if (e.key === 'Enter') { e.preventDefault(); if (highlightedIndex >= 0 && currentSuggestions[highlightedIndex]) selectCard(currentSuggestions[highlightedIndex]); }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.card-search-container')) {
                document.getElementById('suggestions').style.display = 'none';
                highlightedIndex = -1;
                currentSuggestions = [];
            }
        });

        document.querySelectorAll('input[name="emailType"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.getElementById('customEmailSection').style.display = e.target.value === 'custom' ? 'block' : 'none';
            });
        });

        document.getElementById('liveDate').valueAsDate = new Date();
    </script>
</body>
</html>
